services:
  - type: web
    name: cinesense-ai
    runtime: python
    plan: standard
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn ai_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: cinesense-api
    runtime: python
    plan: standard
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: cinesense-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AI_URL
        value: https://cinesense-ai.onrender.com
      - key: CINESENSE_DB_PATH
        value: /var/data/cinesense.db
      - key: CINESENSE_CORS_ORIGINS
        value: https://himanshuramteke05-droid.github.io
      - key: TMDB_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
